<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Retro 70s Triple Stripes Ribbon Gradients -->
    <linearGradient id="favTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FA0A8" />
      <stop offset="100%" stop-color="#2E6A70" />
    </linearGradient>
    <linearGradient id="favMustard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5BE58" />
      <stop offset="100%" stop-color="#D48B1E" />
    </linearGradient>
    <linearGradient id="favTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2654A" />
      <stop offset="100%" stop-color="#B33E26" />
    </linearGradient>
  </defs>

  <!-- Tactile 70s Warm Linen Chassis Base -->
  <rect width="100" height="100" rx="24" fill="#FAF6F0" />
  <rect x="3" y="3" width="94" height="94" rx="21" fill="none" stroke="#351C15" stroke-width="4" />

  <!-- Isometric 70s Retro Monogram Ribbon Prism -->
  <g>
    <!-- Top Loop: Retro Teal -->
    <path d="M 50 18 L 78 34 L 64 42 L 50 34 Z" fill="url(#favTeal)" stroke="#351C15" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Right Loop: Mustard Gold -->
    <path d="M 78 34 L 78 66 L 64 58 L 64 42 Z" fill="url(#favMustard)" stroke="#351C15" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Bottom Right Loop: Terracotta -->
    <path d="M 78 66 L 50 82 L 50 66 L 64 58 Z" fill="url(#favTerracotta)" stroke="#351C15" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Bottom Left Loop: Teal -->
    <path d="M 50 82 L 22 66 L 36 58 L 50 66 Z" fill="url(#favTeal)" stroke="#351C15" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Left Loop: Mustard Gold -->
    <path d="M 22 66 L 22 34 L 36 42 L 36 58 Z" fill="url(#favMustard)" stroke="#351C15" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Top Left Loop: Terracotta -->
    <path d="M 22 34 L 50 18 L 50 34 L 36 42 Z" fill="url(#favTerracotta)" stroke="#351C15" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Center Core: Solid Chocolate Mahogany Diamond -->
    <polygon points="50,40 60,50 50,60 40,50" fill="#351C15" />
    
    <!-- Center Pin Point -->
    <circle cx="50" cy="50" r="3" fill="#FAF6F0" stroke="#351C15" stroke-width="1.5" />
  </g>
</svg>